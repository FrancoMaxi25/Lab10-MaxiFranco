
name: .NET CI CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore Lab10-MaxiFranco.sln

      - name: Compilar solución
        run: dotnet build Lab10-MaxiFranco.sln --configuration Release --no-restore

      - name: Publicar API
        run: dotnet publish Lab10-MaxiFranco.Api/Lab10-MaxiFranco.Api.csproj --configuration Release --no-restore --output ./publish

      - name: Guardar archivos publicados
        uses: actions/upload-artifact@v4
        with:
          name: Lab10-Publish
          path: ./publish

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Preparar conexión segura
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Preparar directorio en EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" "mkdir -p /home/ubuntu/Lab10-Publish"

      - name: Transferir publicación mediante SCP
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -r ./publish/* "$EC2_USER@$EC2_HOST:/home/ubuntu/Lab10-Publish/"

      - name: Desplegar y reiniciar API
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" "sudo cp -a /home/ubuntu/Lab10-Publish/. /var/www/lab10/ && sudo systemctl restart lab10 && sudo systemctl is-active lab10"
